<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src blob:; img-src 'self' data:; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcademicRunner</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/problem-list.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/run-panel.css">
</head>
<body>
  <header class="topbar">
    <h1 class="app-name">AcademicRunner</h1>
    <span class="spacer"></span>
    <button id="root-button" class="text-button" type="button" title="문제 풀이 폴더를 바꿉니다">폴더 선택</button>
    <button id="theme-button" class="icon-button" type="button" aria-label="테마 전환" title="테마 전환 (시스템 / 라이트 / 다크)">
      <span id="theme-icon" class="icon icon-monitor"></span>
    </button>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="문제 목록">
      <div class="sidebar-tools">
        <input id="search-input" class="search-input" type="search" placeholder="번호나 제목으로 검색" aria-label="문제 검색" autocomplete="off">
        <select id="level-filter" class="level-filter" aria-label="단계 필터"></select>
      </div>
      <div id="problem-list" class="problem-list"></div>
    </aside>
    <main id="workspace" class="workspace">
      <p class="empty-title">과제 풀이를 열어 실행하는 앱</p>
      <p class="empty-sub">왼쪽에서 문제를 고르세요.</p>
    </main>
  </div>
  <footer class="statusbar">
    <span id="status-root">-</span>
    <span class="spacer"></span>
    <span id="status-tools" class="status-tools"></span>
    <span id="app-version">-</span>
  </footer>
  <script src="theme.js"></script>
  <script src="ui/problem-filter.js"></script>
  <script src="ui/problem-list.js"></script>
  <script src="ui/problem-nav.js"></script>
  <script src="ui/shortcuts.js"></script>
  <script src="ui/autosaver.js"></script>
  <script src="ui/monaco-loader.js"></script>
  <script src="ui/snippet-data.js"></script>
  <script src="ui/snippets.js"></script>
  <script src="ui/editor-pane.js"></script>
  <script src="ui/run-summary.js"></script>
  <script src="ui/cases-panel.js"></script>
  <script src="ui/run-panel.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
