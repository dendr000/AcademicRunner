<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AcademicRunner</title>
  <link rel="stylesheet" href="/m.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon" type="button" hidden aria-label="목록으로">&lt;</button>
    <h1 id="title">AcademicRunner</h1>
  </header>
  <main>
    <section id="login" hidden>
      <p>PC 앱의 환경 설정에 보이는 접속 토큰을 입력하세요.</p>
      <input id="token" type="password" autocomplete="off" placeholder="접속 토큰">
      <button id="login-go" type="button" class="primary">접속</button>
      <p id="login-msg" class="msg"></p>
    </section>
    <section id="list" hidden>
      <input id="search" type="search" placeholder="번호나 제목으로 검색" autocomplete="off">
      <div id="groups"></div>
    </section>
    <section id="code" hidden>
      <div id="tabs" class="tabs"></div>
      <div class="actions">
        <button id="copy" type="button" class="primary">전체 복사</button>
        <span id="copy-msg" class="msg"></span>
      </div>
      <textarea id="source" readonly spellcheck="false" wrap="off"></textarea>
    </section>
    <p id="status" class="msg"></p>
  </main>
  <script src="/m.js"></script>
</body>
</html>
